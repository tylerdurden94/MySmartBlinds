name: msb-office-blind.v2
components:
  - id: main
    capabilities:
      - id: __NAMESPACE__.mysmartblindsTiltControl
        version: 1
      - id: __NAMESPACE__.mysmartblindsTiltPosition
        version: 1
      - id: battery
        version: 1
      - id: __NAMESPACE__.mysmartblindsRawTelemetry
        version: 1
      - id: refresh
        version: 1
    categories:
      - name: Blind
preferences:
  - title: Bridge token
    name: bridgeToken
    description: Token stored under AppData Local MySmartBlinds
    required: false
    preferenceType: string
    definition:
      stringType: password
      minLength: 0
      maxLength: 128
      default: ""
